global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fridmakweb
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/app-metrics-token
    static_configs:
      - targets: ["app:8080"]

  - job_name: wasmgate
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/wasmgate-admin-token
    static_configs:
      - targets: ["wasmgate:9099"]

  - job_name: wasmgate-control-plane
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/wasmgate-cp-admin-token
    static_configs:
      - targets: ["wasmgate-cp:9097"]
